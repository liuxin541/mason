<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>火灾逃生模拟 - 3D 物理真实版</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; margin: 0; padding: 20px; color: #eee; }
        .container { max-width: 1400px; margin: 0 auto; }
        .top-bar { background: #16213e; padding: 12px 24px; border-radius: 12px; margin-bottom: 20px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
        .top-bar select { background: #0f3460; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 16px; cursor: pointer; }
        .model-name { background: #e94560; padding: 6px 16px; border-radius: 30px; font-weight: bold; font-size: 18px; }
        .middle-area { display: flex; gap: 20px; margin-bottom: 20px; height: 65vh; min-height: 500px; }
        .canvas-container { flex: 2; background: #0f0f1a; border-radius: 16px; padding: 12px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; }
        #simCanvas { background-color: #111; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.5); cursor: grab; max-width: 100%; max-height: 100%; width: auto; height: auto; border: 1px solid #333; }
        #simCanvas:active { cursor: grabbing; }
        .right-panel { flex: 1; display: flex; flex-direction: column; gap: 20px; height: 100%; overflow: hidden; }
        .info-box, .log-box { background: #16213e; border-radius: 16px; padding: 16px; flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .info-content, .log-content { background: #0a0c15; border-radius: 12px; padding: 12px; flex: 1; overflow-y: auto; }
        .control-bar { background: #16213e; border-radius: 16px; padding: 12px 20px; display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .control-bar button { padding: 6px 14px; font-weight: bold; border: none; border-radius: 40px; cursor: pointer; background: #0f3460; color: white; font-size: 13px; }
        .start-btn { background: #2e7d32; }
        .pause-btn { background: #f9a825; color: #000; }
        .resume-btn { background: #2196f3; }
        .step-btn { background: #f9a825; color: #000; }
        .reset-btn { background: #6a1b9a; }
        .map-btn { background: #ff9800; }
        .toggle-persons-btn { background: #9c27b0; }
        .speed-btn { background: #00bcd4; color: #000; }
        .speed-btn.active { background: #ff5722; color: #fff; }
        .modal { display: none; position: fixed; z-index: 1000; left:0; top:0; width:100%; height:100%; overflow:auto; background-color: rgba(0,0,0,0.7); }
        .modal-content { background-color: #2d2d44; margin: 5% auto; padding: 20px; border-radius: 16px; width: 80%; max-width: 900px; color: #eee; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #555; }
        .close { color: #aaa; font-size: 28px; cursor: pointer; }
        .map-list ul { list-style: none; padding: 0; max-height: 200px; overflow-y: auto; }
        .map-list li { padding: 8px; margin: 5px 0; background: #16213e; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .map-list li span { cursor: pointer; flex: 1; }
        .map-list li .edit-btn { background: #2196f3; color: white; border: none; border-radius: 4px; padding: 4px 12px; cursor: pointer; margin-left: 10px; }
        .editor-controls { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
        .editor-canvas { background: #111; border: 1px solid #555; cursor: crosshair; margin-top: 10px; }
        .image-upload-area { margin-top: 15px; padding-top: 15px; border-top: 1px solid #555; }
        .image-upload-area input[type="file"] { background: #0f3460; color: white; padding: 6px; border-radius: 4px; border: none; }
        .image-upload-area input[type="range"] { width: 200px; vertical-align: middle; }
        .image-upload-area .preview-img { max-width: 100%; max-height: 200px; margin: 10px 0; border: 1px solid #555; }
        .log-time { color: #88ffaa; }
        .error { color: #ff8888; }
        .boundary-mode { background: #ffeb3b; color: black; }
        .fire-source-mode { background: #ff1744; color: white; }
        .speed-label { font-size: 13px; color: #aaa; margin-right: 4px; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <select id="modelSelect"><option value="FireEscape">🔥 火灾逃生 (3D物理版)</option></select>
        <div class="model-name">📌 当前模型: <span id="currentModel">FireEscape</span></div>
    </div>
    <div class="middle-area">
        <div class="canvas-container">
            <canvas id="simCanvas"></canvas>
            <div id="loadingTip" style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); color:#888; pointer-events:none;">加载3D引擎中...</div>
        </div>
        <div class="right-panel">
            <div class="info-box"><h3>📊 实时统计</h3><div class="info-content" id="infoContent">加载中...</div></div>
            <div class="log-box"><h3>📋 事件日志</h3><div class="log-content" id="logContent">等待数据...</div></div>
        </div>
    </div>
    <div class="control-bar">
        <button id="startBtn" class="start-btn">▶ 启动/重置</button>
        <button id="pauseBtn" class="pause-btn">⏸ 暂停</button>
        <button id="resumeBtn" class="resume-btn">▶ 继续</button>
        <button id="stepBtn" class="step-btn">⏩ 单步</button>
        <button id="resetBtn" class="reset-btn">🔄 重置</button>
        <button id="mapBtn" class="map-btn">🗺️ 地图</button>
        <button id="togglePersonsBtn" class="toggle-persons-btn">👤 隐藏人员</button>
        <span class="speed-label">速度:</span>
        <button class="speed-btn active" data-speed="1">1×</button>
        <button class="speed-btn" data-speed="2">2×</button>
        <button class="speed-btn" data-speed="3">3×</button>
        <button class="speed-btn" data-speed="4">4×</button>
        <button class="speed-btn" data-speed="8">8×</button>
    </div>
</div>

<!-- 地图模态窗 -->
<div id="mapModal" class="modal">
    <div class="modal-content">
        <div class="modal-header"><h2>🗺️ 地图管理</h2><span class="close">&times;</span></div>
        <div class="map-list"><h3>已保存的地图</h3><ul id="mapList"></ul><button id="refreshMapsBtn">刷新列表</button></div>
        <div class="map-editor">
            <h3>绘制新地图</h3>
            <canvas id="editorCanvas" width="600" height="400" class="editor-canvas"></canvas>
            <div class="editor-controls">
                <button id="drawEmptyBtn" style="background:#111; color:white;">⬛ 空地(0)</button>
                <button id="drawWallBtn" style="background:#4a4a5a; color:white;">🧱 墙(1)</button>
                <button id="drawCombustBtn" style="background:#ff8c00; color:black;">🔥 可燃物(2)</button>
                <button id="drawDoorBtn" style="background:#2196f3; color:white;">🚪 门(3)</button>
                <button id="drawExitBtn" style="background:#4caf50; color:white;">🚪 出口(4)</button>
                <button id="drawBoundaryBtn" style="background:#ffeb3b; color:black;">🟨 边界</button>
                <button id="drawFireBtn" style="background:#ff1744; color:white;">🔥 火源</button>
                <button id="clearMapBtn">清除全部(设为0)</button>
                <input type="text" id="newMapName" placeholder="地图名称.map" value="newmap.map">
                <button id="saveNewMapBtn">保存地图</button>
            </div>
            <p style="font-size:12px;">提示：点击"火源"后在地图上点击放置/删除火源（红色圆点）。点击"边界"后点击画点，双击闭合。</p>
        </div>
        <div class="image-upload-area">
            <h3>从图片生成地图</h3>
            <p style="font-size:12px;">上传建筑平面图（白色背景，黑色墙体），调整阈值后生成障碍物地图。</p>
            <input type="file" id="imageInput" accept="image/*">
            <br>
            <label>二值化阈值: <span id="thresholdLabel">128</span></label>
            <input type="range" id="thresholdSlider" min="0" max="255" value="128">
            <br>
            <button id="generateMapBtn">生成地图并应用</button>
            <br>
            <img id="previewImage" class="preview-img" style="display:none;" alt="预览">
        </div>
    </div>
</div>

<script type="module">
    // ================================================================
    // 1. 引入 Three.js 核心库
    // ================================================================
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ================================================================
    // 2. 核心变量
    // ================================================================
    const canvas = document.getElementById('simCanvas');
    const loadingTip = document.getElementById('loadingTip');
    let scene, camera, renderer, controls;
    let voxelMesh = null;
    let personGroup = new THREE.Group();
    let lastStep = -1, currentData = null;
    const T_AMB = 293.15;

    const dx = 0.5, dz = 0.25;

    // ================================================================
    // 3. 辅助函数
    // ================================================================
    function addLog(msg, type) {
        let d = document.getElementById('logContent');
        let t = new Date().toLocaleTimeString();
        let c = type === 'error' ? 'error' : 'log-time';
        let e = document.createElement('div');
        e.innerHTML = `<span class="${c}">[${t}]</span> ${msg}`;
        d.appendChild(e);
        e.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    function updateStats(d) {
        let timeStr = d.currentTime ? d.currentTime.toFixed(1) : '0.0';
        document.getElementById('infoContent').innerHTML =
            `时间: <strong>${timeStr} s</strong><br>` +
            `步数: ${d.step}<br>` +
            `存活: ${d.active}<br>` +
            `火烧死: ${d.deadFire}<br>` +
            `烟熏死: ${d.deadSmoke}<br>` +
            `逃出: ${d.escaped}<br>` +
            `总人数: ${d.total}`;
    }

    function sendCommand(cmd) {
        fetch('/command', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `cmd=${cmd}`
        }).then(() => {
            addLog(`指令已发送: ${cmd}`, 'info');
            fetchState();
        }).catch(e => addLog(`指令失败: ${e}`, 'error'));
    }

    function fetchState() {
        fetch('/state')
            .then(r => r.json())
            .then(d => {
                currentData = d;
                updateStats(d);
                update3DWorld(d);
                if (lastStep !== d.step) lastStep = d.step;
            })
            .catch(e => addLog('获取状态失败: ' + e, 'error'));
    }

    // ================================================================
    // 4. 温度颜色映射
    // ================================================================
    function temperatureToColor(temp) {
        if (temp < T_AMB) return new THREE.Color(0x000000);
        if (temp < 373.15) {
            let t = (temp - T_AMB) / (373.15 - T_AMB);
            let r = Math.floor(80 * t) / 255;
            return new THREE.Color(r, 0, 0);
        } else if (temp < 573.15) {
            let t = (temp - 373.15) / (573.15 - 373.15);
            let r = (80 + 175 * t) / 255;
            let g = (20 * t) / 255;
            return new THREE.Color(r, g, 0);
        } else if (temp < 773.15) {
            let t = (temp - 573.15) / (773.15 - 573.15);
            let g = (20 + 235 * t) / 255;
            return new THREE.Color(1, g, 0);
        } else if (temp < 1073.15) {
            let t = (temp - 773.15) / (1073.15 - 773.15);
            let b = (80 * t) / 255;
            return new THREE.Color(1, 1, b);
        } else {
            return new THREE.Color(1, 1, 1);
        }
    }

    function valueToColor(val) {
        if (val === 0) return null;
        if (val === 1) return new THREE.Color(0x4a4a5a);
        if (val === 2) return new THREE.Color(0x886644);
        if (val === 3) return new THREE.Color(0x6688aa);
        if (val === 4) return new THREE.Color(0x4caf50);
        if (val === 5) return new THREE.Color(0x7a7a8a);
        return new THREE.Color(0x888888);
    }

    // ================================================================
    // 5. 3D 场景初始化
    // ================================================================
    function init3D() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);

        camera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
        camera.position.set(60, 40, 60);

        renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setSize(canvas.clientWidth, canvas.clientHeight);
        renderer.shadowMap.enabled = true;

        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(10, 10, 12 * dz / 2);
        controls.update();

        const ambLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 50, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const gridHelper = new THREE.GridHelper(30, 20, 0x444466, 0x222244);
        gridHelper.position.set(10, 10, -0.1);
        scene.add(gridHelper);

        loadingTip.style.display = 'none';
        addLog('3D 引擎加载完毕，按住左键可旋转视角', 'info');
        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }

    function resizeCanvas() {
        let c = document.querySelector('.canvas-container');
        let maxW = c.clientWidth - 20;
        let maxH = c.clientHeight - 20;
        let ratio = 1000 / 700;
        let w = Math.min(maxW, maxH * ratio);
        let h = w / ratio;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        if (renderer) {
            renderer.setSize(w, h);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
    }
    window.addEventListener('resize', resizeCanvas);

    // ================================================================
    // 6. 核心渲染函数 (真正 3D 全数据支持)
    // ================================================================
    function update3DWorld(data) {
        if (!data) return;
        const depth = data.depth || 8;
        const w = data.width, h = data.height;

        scene.remove(personGroup);
        personGroup = new THREE.Group();

        const matrices = [];
        const colors = [];
        const dummy = new THREE.Object3D();

        // ★ 遍历真正的 3D 网格数据 (障碍物、温度、烟雾)
        for (let z = 0; z < depth; z++) {
            const zPos = z * dz + dz / 2;
            for (let x = 0; x < w; x++) {
                const xPos = x * dx + dx / 2;
                for (let y = 0; y < h; y++) {
                    const yPos = y * dx + dx / 2;

                    // ★ 取出 3D 空间对应位置的属性
                    const obs = data.obstacle[z]?.[x]?.[y];
                    const temp = data.fire[z]?.[x]?.[y] || T_AMB;
                    const smoke = data.smoke[z]?.[x]?.[y] || 0;

                    let color = null;
                    let draw = false;

                    // 1. 优先渲染建筑结构（墙、楼板、楼梯、出口等）
                    if (obs !== undefined && obs !== 0) {
                        draw = true;
                        color = valueToColor(obs);
                    }
                    // 2. 其次渲染烟雾（烟雾优先于温度显示）
                    else if (smoke > 0.001) {
                        draw = true;
                        const t = Math.min(smoke / 0.15, 1.0);
                        const gray = 0.78 - t * 0.58;
                        color = new THREE.Color(gray, gray, gray);
                    }
                    // 3. 温度分级渲染（仅无烟雾时显示）
                    else if (temp > 473.15) {
                        // > 200°C: 真正的火焰
                        draw = true;
                        color = temperatureToColor(temp);
                    } else if (temp > 373.15) {
                        // 100-200°C: 热空气（淡橙色）
                        draw = true;
                        const t = Math.min((temp - 373.15) / 100.0, 1.0);
                        color = new THREE.Color(0.95 - t * 0.15, 0.75 - t * 0.35, 0.45 - t * 0.45);
                    }

                    if (draw && color) {
                        dummy.position.set(xPos, yPos, zPos);
                        dummy.updateMatrix();
                        matrices.push(dummy.matrix.clone());
                        colors.push(color);
                    }
                }
            }
        }

        // 生成 Mesh
        if (matrices.length > 0) {
            if (!voxelMesh || matrices.length !== voxelMesh.count) {
                if (voxelMesh) scene.remove(voxelMesh);
                const geometry = new THREE.BoxGeometry(dx * 0.9, dx * 0.9, dz * 0.9);
                const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
                voxelMesh = new THREE.InstancedMesh(geometry, material, matrices.length);
                voxelMesh.castShadow = true;
                scene.add(voxelMesh);
            }
            for (let i = 0; i < matrices.length; i++) {
                voxelMesh.setMatrixAt(i, matrices[i]);
                voxelMesh.setColorAt(i, colors[i]);
            }
            voxelMesh.instanceMatrix.needsUpdate = true;
            voxelMesh.instanceColor.needsUpdate = true;
        }

        // ★ 人员生成：接收最新的 3D 坐标 (x, y, z)
        if (data.persons && data.persons.length > 0) {
            const sphereGeo = new THREE.SphereGeometry(dx * 0.35, 8, 8);
            const sphereMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
            for (let p of data.persons) {
                const sphere = new THREE.Mesh(sphereGeo, sphereMat);
                // 提取第三个参数 p[2] 作为人员所在高度
                sphere.position.set(p[0] * dx + dx/2, p[1] * dx + dx/2, p[2] * dz + dz/2);
                personGroup.add(sphere);
            }
            scene.add(personGroup);
        }
    }

    // ================================================================
    // 7. 绑定 UI 控制按钮 (保持原本逻辑)
    // ================================================================
    document.getElementById('startBtn').onclick = () => sendCommand('start');
    document.getElementById('pauseBtn').onclick = () => sendCommand('pause');
    document.getElementById('resumeBtn').onclick = () => sendCommand('resume');
    document.getElementById('stepBtn').onclick = () => sendCommand('step');
    document.getElementById('resetBtn').onclick = () => {
        if (voxelMesh) { scene.remove(voxelMesh); voxelMesh = null; }
        sendCommand('reset');
    };

    document.getElementById('togglePersonsBtn').onclick = function() {
        sendCommand('togglePersons');
        this.textContent = this.textContent.includes('隐藏') ? '👤 显示人员' : '👤 隐藏人员';
    };

    document.querySelectorAll('.speed-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            let speed = parseInt(this.dataset.speed);
            sendCommand('speed_' + speed);
            addLog(`速度切换至 ${speed} 倍`, 'info');
        });
    });

    // ================================================================
    // 8. 模态框兼容 (地图编辑器保持原样)
    // ================================================================
    const modal = document.getElementById('mapModal');
    const modalClose = document.querySelector('.close');

    document.getElementById('mapBtn').onclick = () => {
        modal.style.display = 'block';
        controls.enabled = false;
        loadMapList();
        initEditor();
    };
    modalClose.onclick = () => {
        modal.style.display = 'none';
        controls.enabled = true;
    };
    window.onclick = e => {
        if (e.target === modal) {
            modal.style.display = 'none';
            controls.enabled = true;
        }
    };

    let editorCanvas = document.getElementById('editorCanvas');
    let editorCtx = editorCanvas.getContext('2d');
    let editorWidth = 120, editorHeight = 80;
    let editorObstacles = null;
    let currentDrawType = 0;
    let boundaryPoints = [];
    let isDrawingBoundary = false;
    let isDrawingFire = false;
    let fireSources = [];

    function initEditor() {
        editorCanvas.width = 600; editorCanvas.height = 400;
        fetch('/state').then(r => r.json()).then(d => {
            // obstacle 维度约定: [Z][X][Y] , 取 Z=0 层作为编辑对象
            let z0 = (Array.isArray(d.obstacle) && d.obstacle.length > 0 && Array.isArray(d.obstacle[0])) ? d.obstacle[0] : (Array.isArray(d.obstacle) ? d.obstacle : null);
            if (!z0 || !Array.isArray(z0) || z0.length === 0 || !Array.isArray(z0[0])) {
                throw new Error("obstacle 数据格式异常或为空");
            }
            // 根据真实尺寸同步编辑器大小
            editorWidth = z0.length;
            editorHeight = z0[0].length;
            editorObstacles = z0;
            fireSources = d.fireSources || [];
            drawEditor();
        }).catch(e => addLog("初始化编辑器失败: " + e, 'error'));
    }

    function drawEditor() {
        if (!editorObstacles || !editorWidth || !editorHeight) return;
        let cellW = editorCanvas.width / editorWidth;
        let cellH = editorCanvas.height / editorHeight;
        editorCtx.clearRect(0, 0, editorCanvas.width, editorCanvas.height);

        for (let i = 0; i < editorWidth; i++) {
            for (let j = 0; j < editorHeight; j++) {
                let row = editorObstacles[i];
                let val = (row && row.length > j) ? row[j] : 0;
                if (val === 1) editorCtx.fillStyle = '#4a4a5a';
                else if (val === 2) editorCtx.fillStyle = '#ff8c00';
                else if (val === 3) editorCtx.fillStyle = '#2196f3';
                else if (val === 4) editorCtx.fillStyle = '#4caf50';
                else if (val === 5) editorCtx.fillStyle = '#ff1744';
                else editorCtx.fillStyle = '#111';
                editorCtx.fillRect(i * cellW, j * cellH, cellW, cellH);
                editorCtx.strokeStyle = '#333';
                editorCtx.strokeRect(i * cellW, j * cellH, cellW, cellH);
            }
        }
        for (let f of fireSources) {
            let x = f.x * cellW + cellW / 2, y = f.y * cellH + cellH / 2;
            editorCtx.fillStyle = '#ff1744';
            editorCtx.beginPath(); editorCtx.arc(x, y, Math.min(cellW, cellH) / 2.5, 0, 2 * Math.PI); editorCtx.fill();
            editorCtx.strokeStyle = '#fff'; editorCtx.lineWidth = 1; editorCtx.stroke();
        }
    }

    function loadMapList() {
        fetch('/listMaps').then(r => r.json()).then(data => {
            let ul = document.getElementById('mapList'); ul.innerHTML = '';
            if (!data.maps || data.maps.length === 0) {
                ul.innerHTML = '<li style="justify-content:center;">暂无地图文件</li>';
                return;
            }
            data.maps.forEach(map => {
                let li = document.createElement('li');
                let span = document.createElement('span');
                span.textContent = map;
                span.onclick = () => {
                    if (confirm(`加载地图 ${map} 会重置当前模拟，确定吗？`)) {
                        fetch(`/loadMap?name=${encodeURIComponent(map)}`, { method: 'POST' }).then(() => {
                            addLog(`已加载地图: ${map}`, 'info');
                            modal.style.display = 'none'; controls.enabled = true;
                            fetchState();
                        }).catch(e => addLog(`加载失败: ${e}`, 'error'));
                    }
                };
                li.appendChild(span); ul.appendChild(li);
            });
        }).catch(e => addLog('获取地图列表失败: ' + e, 'error'));
    }

    document.getElementById('drawEmptyBtn').onclick = () => { currentDrawType = 0; };
    document.getElementById('drawWallBtn').onclick = () => { currentDrawType = 1; };
    document.getElementById('drawCombustBtn').onclick = () => { currentDrawType = 2; };
    document.getElementById('drawDoorBtn').onclick = () => { currentDrawType = 3; };
    document.getElementById('drawExitBtn').onclick = () => { currentDrawType = 4; };
    document.getElementById('clearMapBtn').onclick = () => {
        if (confirm('清除所有障碍物？')) {
            for (let i = 0; i < editorWidth; i++) for (let j = 0; j < editorHeight; j++) editorObstacles[i][j] = 0;
            drawEditor();
        }
    };
    document.getElementById('saveNewMapBtn').onclick = () => {
        let name = document.getElementById('newMapName').value.trim() || 'custom.map';
        if (!name.endsWith('.map')) name += '.map';
        fetch('/saveMap', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: `name=${encodeURIComponent(name)}` })
            .then(() => { addLog(`地图已保存: ${name}`, 'info'); loadMapList(); })
            .catch(e => addLog(`保存失败: ${e}`, 'error'));
    };

    function handleEditorClick(e, isRight) {
        let rect = editorCanvas.getBoundingClientRect();
        let scaleX = editorCanvas.width / rect.width, scaleY = editorCanvas.height / rect.height;
        let mouseX = (e.clientX - rect.left) * scaleX, mouseY = (e.clientY - rect.top) * scaleY;
        let cellW = editorCanvas.width / editorWidth, cellH = editorCanvas.height / editorHeight;
        let gridX = Math.floor(mouseX / cellW), gridY = Math.floor(mouseY / cellH);
        if (gridX < 0 || gridX >= editorWidth || gridY < 0 || gridY >= editorHeight) return;

        if (isDrawingFire) {
            let idx = fireSources.findIndex(f => f.x === gridX && f.y === gridY);
            if (idx >= 0) fireSources.splice(idx, 1);
            else fireSources.push({ x: gridX, y: gridY });
            drawEditor();
            syncFireSources();
            return;
        }
        if (isRight) editorObstacles[gridX][gridY] = 0;
        else editorObstacles[gridX][gridY] = currentDrawType;
        drawEditor();
    }
    function syncFireSources() {
        if (fireSources.length === 0) return;
        let coords = fireSources.map(f => [f.x, f.y]);
        fetch('/setFireSources', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sources: coords }) })
            .then(() => addLog('火源已更新', 'info')).catch(err => addLog('更新火源失败: ' + err, 'error'));
    }

    editorCanvas.addEventListener('click', function(e) { handleEditorClick(e, false); });
    editorCanvas.addEventListener('contextmenu', function(e) { e.preventDefault(); handleEditorClick(e, true); return false; });
    document.getElementById('refreshMapsBtn').onclick = loadMapList;
    document.getElementById('drawBoundaryBtn').onclick = function() {
        isDrawingBoundary = !isDrawingBoundary;
        boundaryPoints = [];
        addLog(isDrawingBoundary ? '进入边界绘制模式：点击画点，双击闭合' : '退出边界绘制模式', 'info');
        this.textContent = isDrawingBoundary ? '🟨 取消边界' : '🟨 边界';
        drawEditor();
    };
    document.getElementById('drawFireBtn').onclick = function() {
        isDrawingFire = !isDrawingFire;
        addLog(isDrawingFire ? '进入火源绘制模式' : '退出火源绘制模式', 'info');
        this.textContent = isDrawingFire ? '🔥 取消火源' : '🔥 火源';
        drawEditor();
    };
    editorCanvas.addEventListener('dblclick', function(e) {
        if (!isDrawingBoundary || boundaryPoints.length < 3) return;
        fetch('/setBoundary', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ points: boundaryPoints }) })
            .then(() => { addLog('边界已设置', 'info'); isDrawingBoundary = false; document.getElementById('drawBoundaryBtn').textContent = '🟨 边界'; initEditor(); modal.style.display = 'none'; controls.enabled = true; fetchState(); })
            .catch(err => addLog('设置边界失败: ' + err, 'error'));
    });

    document.getElementById('generateMapBtn').onclick = function() {
        const file = document.getElementById('imageInput').files[0];
        if (!file) { addLog('请先选择一张图片', 'error'); return; }
        const reader = new FileReader();
        reader.onload = function(ev) {
            const base64 = ev.target.result.split(',')[1];
            const threshold = parseInt(document.getElementById('thresholdSlider').value);
            fetch('/uploadMapImage', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ imageData: base64, threshold: threshold }) })
                .then(response => {
                    if (response.ok) { addLog('地图已从图片生成并应用', 'info'); modal.style.display = 'none'; controls.enabled = true; fetchState(); initEditor(); }
                    else { addLog('生成地图失败: ' + response.status, 'error'); }
                }).catch(err => addLog('请求失败: ' + err, 'error'));
        };
        reader.readAsDataURL(file);
    };

    // ================================================================
    // 9. 启动运行！
    // ================================================================
    setTimeout(resizeCanvas, 100);
    init3D();
    setInterval(fetchState, 150);
    fetchState();
    addLog('3D 物理真实版加载完成，按住左键可旋转视角', 'info');
</script>
</body>
</html>
