<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>火灾逃生模拟 - 3D 物理真实版</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; margin: 0; padding: 20px; color: #eee; }
        .container { max-width: 1400px; margin: 0 auto; }
        .top-bar { background: #16213e; padding: 12px 24px; border-radius: 12px; margin-bottom: 20px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
        .top-bar select { background: #0f3460; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 16px; cursor: pointer; }
        .model-name { background: #e94560; padding: 6px 16px; border-radius: 30px; font-weight: bold; font-size: 18px; }
        .middle-area { display: flex; gap: 20px; margin-bottom: 20px; height: 65vh; min-height: 500px; }
        .canvas-container { flex: 2; background: #0f0f1a; border-radius: 16px; padding: 12px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; }
        #simCanvas { background-color: #111; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.5); cursor: grab; max-width: 100%; max-height: 100%; width: auto; height: auto; border: 1px solid #333; }
        #simCanvas:active { cursor: grabbing; }
        .right-panel { flex: 1; display: flex; flex-direction: column; gap: 20px; height: 100%; overflow: hidden; }
        .info-box, .log-box { background: #16213e; border-radius: 16px; padding: 16px; flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .info-content, .log-content { background: #0a0c15; border-radius: 12px; padding: 12px; flex: 1; overflow-y: auto; }
        .control-bar { background: #16213e; border-radius: 16px; padding: 12px 20px; display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .control-bar button { padding: 6px 14px; font-weight: bold; border: none; border-radius: 40px; cursor: pointer; background: #0f3460; color: white; font-size: 13px; }
        .start-btn { background: #2e7d32; }
        .pause-btn { background: #f9a825; color: #000; }
        .resume-btn { background: #2196f3; }
        .step-btn { background: #f9a825; color: #000; }
        .reset-btn { background: #6a1b9a; }
        .map-btn { background: #ff9800; }
        .toggle-persons-btn { background: #9c27b0; }
        .speed-btn { background: #00bcd4; color: #000; }
        .speed-btn.active { background: #ff5722; color: #fff; }
        .modal { display: none; position: fixed; z-index: 1000; left:0; top:0; width:100%; height:100%; overflow:auto; background-color: rgba(0,0,0,0.7); }
        .modal-content { background-color: #2d2d44; margin: 5% auto; padding: 20px; border-radius: 16px; width: 80%; max-width: 900px; color: #eee; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #555; }
        .close { color: #aaa; font-size: 28px; cursor: pointer; }
        .map-list ul { list-style: none; padding: 0; max-height: 200px; overflow-y: auto; }
        .map-list li { padding: 8px; margin: 5px 0; background: #16213e; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .map-list li span { cursor: pointer; flex: 1; }
        .map-list li .edit-btn { background: #2196f3; color: white; border: none; border-radius: 4px; padding: 4px 12px; cursor: pointer; margin-left: 10px; }
        .editor-controls { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
        .editor-canvas { background: #111; border: 1px solid #555; cursor: crosshair; margin-top: 10px; }
        .image-upload-area { margin-top: 15px; padding-top: 15px; border-top: 1px solid #555; }
        .image-upload-area input[type="file"] { background: #0f3460; color: white; padding: 6px; border-radius: 4px; border: none; }
        .image-upload-area input[type="range"] { width: 200px; vertical-align: middle; }
        .image-upload-area .preview-img { max-width: 100%; max-height: 200px; margin: 10px 0; border: 1px solid #555; }
        .log-time { color: #88ffaa; }
        .error { color: #ff8888; }
        .boundary-mode { background: #ffeb3b; color: black; }
        .fire-source-mode { background: #ff1744; color: white; }
        .speed-label { font-size: 13px; color: #aaa; margin-right: 4px; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <select id="modelSelect"><option value="FireEscape">🔥 火灾逃生 (3D物理版)</option></select>
        <div class="model-name">📌 当前模型: <span id="currentModel">FireEscape</span></div>
    </div>
    <div class="middle-area">
        <div class="canvas-container">
            <canvas id="simCanvas"></canvas>
            <div id="loadingTip" style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); color:#888; pointer-events:none;">加载3D引擎中...</div>
        </div>
        <div class="right-panel">
            <div class="info-box"><h3>📊 实时统计</h3><div class="info-content" id="infoContent">加载中...</div></div>
            <div class="log-box"><h3>📋 事件日志</h3><div class="log-content" id="logContent">等待数据...</div></div>

    <div class="control-bar">

                <button id="drawCombustBtn" style="background:#ff8c00; color:black;">🔥 可燃物(2)</button>

<script type="module">
    // ================================================================
    // 1. 引入 Three.js 核心库
    // ================================================================
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ================================================================
    // 2. 核心变量
    // ================================================================
    const canvas = document.getElementById('simCanvas');
    const loadingTip = document.getElementById('loadingTip');
    let scene, camera, renderer, controls;
    let voxelMesh = null;
    let personGroup = new THREE.Group();
    let lastStep = -1, currentData = null;
    const T_AMB = 293.15;
    const T_MAX_HOT = 1273.15;

    const dx = 0.5, dz = 0.25;
    const clock = new THREE.Clock();
    let fireParticles = null;
    let smokeParticles = null;
    let volumeSmoke = null;
    let fireLights = [];

    // ================================================================
    // 3. 辅助函数
    // ================================================================
    function addLog(msg, type) {
        let d = document.getElementById('logContent');
        let t = new Date().toLocaleTimeString();
        let c = type === 'error' ? 'error' : 'log-time';
        let e = document.createElement('div');
        e.innerHTML = `<span class="${c}">[${t}]</span> ${msg}`;
        d.appendChild(e);
        e.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    function updateStats(d) {
        let timeStr = d.currentTime ? d.currentTime.toFixed(1) : '0.0';
        document.getElementById('infoContent').innerHTML =
            `时间: <strong>${timeStr} s</strong><br>` +
            `步数: ${d.step}<br>` +
            `存活: ${d.active}<br>` +
            `火烧死: ${d.deadFire}<br>` +
            `烟熏死: ${d.deadSmoke}<br>` +
            `逃出: ${d.escaped}<br>` +
            `总人数: ${d.total}`;
    }

    function sendCommand(cmd) {
        fetch('/command', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `cmd=${cmd}`
        }).then(() => {
            addLog(`指令已发送: ${cmd}`, 'info');
            fetchState();
        }).catch(e => addLog(`指令失败: ${e}`, 'error'));
    }

    let cameraFramed = false;

    function fetchState() {
        fetch('/state')
            .then(r => r.json())
            .then(d => {
                currentData = d;
                updateStats(d);
                update3DWorld(d);
                if (fireParticles) fireParticles.updateSources(d.fireSources, dx, dz, d.fire, d.stride || 1);
                // if (smokeParticles) smokeParticles.updateFromField(d.smoke, d.fire, dx, dz, d.depth, d.stride || 1);
                updateFireLights(d);
                // ★ 首次有数据时自动框住整个建筑（含火/烟区域）
                if (!cameraFramed && d.width && d.depth && controls && camera) {
                    cameraFramed = true;
                    const cx = d.width * dx / 2, cy = d.depth * dz / 2, cz = d.height * dx / 2;
                    controls.target.set(cx, cy, cz);
                    const size = Math.max(d.width * dx, d.depth * dz, d.height * dx);
                    camera.position.set(cx + size * 0.6, cy + size * 0.75, cz + size * 0.6);
                    controls.update();
                }
                if (lastStep !== d.step) lastStep = d.step;
            })
            .catch(e => addLog('获取状态失败: ' + e, 'error'));
    }

    // ================================================================
    // 4. 温度颜色映射
    // ================================================================
    function temperatureToColor(temp) {
        if (temp < T_AMB) return new THREE.Color(0x000000);
        if (temp < 373.15) {
            let t = (temp - T_AMB) / (373.15 - T_AMB);
            let r = Math.floor(80 * t) / 255;
            return new THREE.Color(r, 0, 0);
        } else if (temp < 573.15) {
            let t = (temp - 373.15) / (573.15 - 373.15);
            let r = (80 + 175 * t) / 255;
            let g = (20 * t) / 255;
            return new THREE.Color(r, g, 0);
        } else if (temp < 773.15) {
            let t = (temp - 573.15) / (773.15 - 573.15);
            let g = (20 + 235 * t) / 255;
            return new THREE.Color(1, g, 0);
        } else if (temp < 1073.15) {
            let t = (temp - 773.15) / (1073.15 - 773.15);
            let b = (80 * t) / 255;
            return new THREE.Color(1, 1, b);
        } else {
            return new THREE.Color(1, 1, 1);
        }
    }

    function valueToColor(val) {
        if (val === 0) return null;
        if (val === 1) return new THREE.Color(0x4a4a5a);
        if (val === 2) return new THREE.Color(0x886644);
        if (val === 3) return new THREE.Color(0x6688aa);
        if (val === 4) return new THREE.Color(0x4caf50);
        if (val === 5) return new THREE.Color(0x7a7a8a);
        return new THREE.Color(0x888888);
    }

    // ================================================================
    // 4b. 动态火源点光源 + 烟雾遮挡火焰
    // ================================================================
    function updateFireLights(d) {
        const srcs = d.fireSources || [];
        while (fireLights.length < srcs.length) {
            const l = new THREE.PointLight(0xff6622, 0, 40, 2);
            scene.add(l);
            fireLights.push(l);
        }
        while (fireLights.length > srcs.length) {
            const l = fireLights.pop();
            scene.remove(l);
        }
        srcs.forEach((f, i) => {
            const l = fireLights[i];
            const fh = f.flameHeight || 2.0;
            // 光源位于火焰中部
            l.position.set(f.x * dx + dx/2, f.z * dz + dz/2 + fh * 0.5, f.y * dx + dx/2);
            l.intensity = Math.min(3.0, 0.6 + (f.heatRelease || 0) / 400.0);
        });
        // 烟雾遮挡: 火源上方烟浓度 → 火焰透明度衰减
        if (fireParticles && srcs.length > 0 && d.smoke && d.depth) {
            const f = srcs[0];
            let s = 0, cnt = 0;
            const zTop = Math.min(d.depth - 1, f.z + Math.ceil((f.flameHeight || 2) / dz));
            for (let zi = f.z; zi <= zTop; zi++) {
                s += (d.smoke[zi]?.[f.x]?.[f.y]) || 0;
                cnt++;
            }
            fireParticles.material.uniforms.uSmokeDensity.value = cnt > 0 ? Math.min(1, (s / cnt) * 4) : 0;
        }
    }

    // ================================================================
    // 5. 火焰粒子系统 (GPU Shader)
    // ================================================================
    const fireVertexShader = `
        attribute float aLife;      // 0~1 剩余生命比例
        attribute float aSeed;      // 随机种子 0~1
        attribute float aSize;      // 基础大小
        uniform float uTime;
        uniform float uFlameHeight;
        uniform vec3  uFirePos;
        varying float vLife;
        varying float vSeed;

        // 简化 curl noise (用 sin 模拟湍流)
        vec3 noise3(vec3 p) {
            return vec3(
                sin(p.y*3.0 + p.z*2.0 + uTime*2.0),
                sin(p.x*3.0 + p.z*2.5 + uTime*1.8),
                sin(p.x*2.5 + p.y*3.0 + uTime*2.2)
            ) * 0.5;
        }

        void main() {
            vLife = aLife;
            vSeed = aSeed;
            float t = 1.0 - aLife;  // 0=出生, 1=死亡
            // 向上运动, 高度受火焰高度控制
            vec3 pos = position;
            pos.y += t * uFlameHeight;
            // 湍流偏移 (底部小, 顶部大)
            vec3 turb = noise3(pos * 2.0 + aSeed * 10.0) * t * 0.8;
            pos.xz += turb.xz;
            // 底部收缩 (火焰根部窄)
            float radiusScale = 0.3 + t * 0.7;
            pos.xz *= radiusScale;

            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            // 粒子大小: 底部大, 顶部小, 带闪烁
            float flicker = 0.85 + 0.15 * sin(uTime * 15.0 + aSeed * 50.0);
            gl_PointSize = aSize * (1.0 - t * 0.6) * flicker * (300.0 / -mvPosition.z);
            gl_Position = projectionMatrix * mvPosition;
        }
    `;

    const fireFragmentShader = `
        uniform float uSmokeDensity;
        varying float vLife;
        varying float vSeed;
        void main() {
            // 圆形软边
            vec2 uv = gl_PointCoord - 0.5;
            float dist = length(uv);
            if (dist > 0.5) discard;
            float alpha = smoothstep(0.5, 0.1, dist);
            // 颜色渐变: 底部白黄 → 橙 → 红 → 顶部透明
            float t = 1.0 - vLife;
            vec3 col;
            if (t < 0.3)      col = mix(vec3(1.0, 0.95, 0.6), vec3(1.0, 0.6, 0.1), t/0.3);
            else if (t < 0.7) col = mix(vec3(1.0, 0.6, 0.1), vec3(0.9, 0.2, 0.0), (t-0.3)/0.4);
            else              col = mix(vec3(0.9, 0.2, 0.0), vec3(0.3, 0.0, 0.0), (t-0.7)/0.3);
            alpha *= (1.0 - t * 0.8);
            // 浓烟遮挡火焰
            alpha *= (1.0 - uSmokeDensity * 0.8);
            gl_FragColor = vec4(col, alpha);
        }
    `;

    class FireParticleSystem {
        constructor(scene, maxParticles = 5000) {
            this.scene = scene;
            this.maxParticles = maxParticles;
            this.activeCount = 0;
            this.sources = [];  // [{pos, flameHeight, emissionRate, accumulator}]
            this.emissionScale = 1.0;

            const geo = new THREE.BufferGeometry();
            this.positions = new Float32Array(maxParticles * 3);
            this.life = new Float32Array(maxParticles);
            this.seed = new Float32Array(maxParticles);
            this.size = new Float32Array(maxParticles);
            geo.setAttribute('position', new THREE.BufferAttribute(this.positions, 3));
            geo.setAttribute('aLife', new THREE.BufferAttribute(this.life, 1));
            geo.setAttribute('aSeed', new THREE.BufferAttribute(this.seed, 1));
            geo.setAttribute('aSize', new THREE.BufferAttribute(this.size, 1));
            geo.setDrawRange(0, 0);

            this.material = new THREE.ShaderMaterial({
                vertexShader: fireVertexShader,
                fragmentShader: fireFragmentShader,
                uniforms: {
                    uTime: { value: 0 },
                    uFlameHeight: { value: 2.0 },
                    uFirePos: { value: new THREE.Vector3(0,0,0) },
                    uSmokeDensity: { value: 0.0 }
                },
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                depthTest: false
            });

            this.points = new THREE.Points(geo, this.material);
            this.points.frustumCulled = false;
            scene.add(this.points);
        }

        updateSources(fireSources, dx, dz, fireData, stride) {
            const st = stride || 1;
            const srcs = (fireSources || []).map(f => ({
                pos: new THREE.Vector3(f.x * dx + dx/2, f.z * dz + dz/2, f.y * dx + dx/2),
                flameHeight: f.flameHeight || 2.0,
                emissionRate: Math.min(120, 20 + (f.heatRelease || 0) * 0.15),
                accumulator: 0
            }));
            // ★ 次级火源: 温度场高温体素(火焰蔓延区域)也发射粒子
            if (fireData && fireData.length) {
                const depth = fireData.length;
                const w = (fireData[0] || []).length;
                const h = (fireData[0]?.[0]) ? fireData[0][0].length : 0;
                if (w && h) {
                    const thresh = T_AMB + 0.25 * (T_MAX_HOT - T_AMB);
                    const baseFh = (fireSources && fireSources[0] && fireSources[0].flameHeight) || 2.0;
                    const spread = [];
                    for (let z = 0; z < depth; z++) {
                        const layer = fireData[z];
                        if (!layer) continue;
                        for (let x = 0; x < w; x++) {
                            const row = layer[x];
                            if (!row) continue;
                            for (let y = 0; y < h; y++) {
                                const t = row[y] || 0;
                                if (t > thresh) {
                                    spread.push({ t: t, x: x, y: y, z: z });
                                }
                            }
                        }
                    }
                    // 按温度取前 150 个, 控制粒子总量
                    spread.sort((a, b) => b.t - a.t);
                    const cap = Math.min(spread.length, 150);
                    for (let i = 0; i < cap; i++) {
                        const s = spread[i];
                        srcs.push({
                            pos: new THREE.Vector3(s.x * dx * st + dx * st / 2, s.z * dz + dz / 2, s.y * dx * st + dx * st / 2),
                            flameHeight: baseFh * 0.6,
                            emissionRate: Math.min(30, 10 + (s.t - T_AMB) * 0.015),
                            accumulator: 0
                        });
                    }
                }
            }
            this.sources = srcs;
        }

        emit(dt) {
            const scale = this.emissionScale;
            for (const src of this.sources) {
                src.accumulator += src.emissionRate * scale * dt;
                const toEmit = Math.floor(src.accumulator);
                src.accumulator -= toEmit;
                for (let i = 0; i < toEmit; i++) {
                    if (this.activeCount >= this.maxParticles) return;
                    const idx = this.activeCount++;
                    // 在火源底部小圆盘内随机分布 (绝对世界坐标)
                    const angle = Math.random() * Math.PI * 2;
                    const r = Math.random() * 0.3;
                    this.positions[idx*3]   = src.pos.x + Math.cos(angle) * r;
                    this.positions[idx*3+1] = src.pos.y + Math.random() * 0.1;
                    this.positions[idx*3+2] = src.pos.z + Math.sin(angle) * r;
                    this.life[idx] = 1.0;
                    this.seed[idx] = Math.random();
                    this.size[idx] = 20 + Math.random() * 15;
                }
            }
        }

        update(dt, time, camera) {
            // LOD: 相机远离时降低发射率
            let scale = 1.0;
            if (camera && this.sources.length > 0) {
                let dist = Infinity;
                for (const src of this.sources) dist = Math.min(dist, src.pos.distanceTo(camera.position));
                if (dist > 25) scale = 0.3;
            }
            if (this.activeCount >= this.maxParticles * 0.9) scale *= 0.5;
            this.emissionScale = scale;

            this.emit(dt);
            // 生命衰减
            const decay = dt * 1.2;  // 粒子寿命 ~0.83s
            for (let i = 0; i < this.activeCount; i++) {
                this.life[i] -= decay;
            }
            // 死亡粒子压缩到末尾
            let writeIdx = 0;
            for (let i = 0; i < this.activeCount; i++) {
                if (this.life[i] > 0) {
                    if (writeIdx !== i) {
                        this.positions[writeIdx*3]   = this.positions[i*3];
                        this.positions[writeIdx*3+1] = this.positions[i*3+1];
                        this.positions[writeIdx*3+2] = this.positions[i*3+2];
                        this.life[writeIdx] = this.life[i];
                        this.seed[writeIdx] = this.seed[i];
                        this.size[writeIdx] = this.size[i];
                    }
                    writeIdx++;
                }
            }
            this.activeCount = writeIdx;
            this.points.geometry.setDrawRange(0, this.activeCount);
            this.points.geometry.attributes.position.needsUpdate = true;
            this.points.geometry.attributes.aLife.needsUpdate = true;
            this.points.geometry.attributes.aSeed.needsUpdate = true;
            this.points.geometry.attributes.aSize.needsUpdate = true;

            // 更新 uniform (取第一个火源, 多火源时可扩展为实例化)
            if (this.sources.length > 0) {
                this.material.uniforms.uFirePos.value.copy(this.sources[0].pos);
                this.material.uniforms.uFlameHeight.value = this.sources[0].flameHeight;
            }
            this.material.uniforms.uTime.value = time;
        }

        dispose() {
            this.scene.remove(this.points);
            this.points.geometry.dispose();
            this.material.dispose();
        }
    }

    // ============================================================
    // 烟雾粒子系统 (GPU Shader)
    // ============================================================
    const smokeVertexShader = `
        attribute float aLife;
        attribute float aSeed;
        attribute float aSize;
        attribute vec3  aVelocity;
        uniform float uTime;
        varying float vLife;
        varying float vSeed;
        varying float vDensity;

        vec3 noise3(vec3 p) {
            return vec3(
                sin(p.y*1.5 + p.z + uTime*0.5),
                sin(p.x*1.5 + p.z*1.2 + uTime*0.4),
                sin(p.x*1.2 + p.y*1.5 + uTime*0.6)
            ) * 0.5;
        }

        void main() {
            vLife = aLife;
            vSeed = aSeed;
            float t = 1.0 - aLife;
            vec3 pos = position + aVelocity * t * 3.0;
            // 烟雾湍流 (比火焰慢、幅度大)
            vec3 turb = noise3(pos * 0.8 + aSeed * 5.0) * t * 1.5;
            pos += turb;

            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            float grow = 1.0 + t * 2.0;  // 粒子越老越大
            gl_PointSize = aSize * grow * (300.0 / -mvPosition.z);
            gl_Position = projectionMatrix * mvPosition;
            vDensity = aLife;
        }
    `;

    const smokeFragmentShader = `
        varying float vLife;
        varying float vSeed;
        varying float vDensity;
        void main() {
            vec2 uv = gl_PointCoord - 0.5;
            float dist = length(uv);
            if (dist > 0.5) discard;
            // 软边高斯
            float alpha = smoothstep(0.5, 0.0, dist);
            alpha *= 0.6 * vDensity;  // 烟雾半透明
            // 颜色: 淡灰 → 深灰 (基于生命和随机)
            float gray = 0.35 + 0.25 * vSeed + (1.0 - vDensity) * 0.2;
            vec3 col = vec3(gray);
            gl_FragColor = vec4(col, alpha);
        }
    `;

    class SmokeParticleSystem {
        constructor(scene, maxParticles = 6000) {
            this.scene = scene;
            this.maxParticles = maxParticles;
            this.activeCount = 0;
            this.emissionCells = [];  // [{pos, vel, density, acc}]
            this.emissionScale = 1.0;

            const geo = new THREE.BufferGeometry();
            this.positions = new Float32Array(maxParticles * 3);
            this.velocities = new Float32Array(maxParticles * 3);
            this.life = new Float32Array(maxParticles);
            this.seed = new Float32Array(maxParticles);
            this.size = new Float32Array(maxParticles);
            geo.setAttribute('position', new THREE.BufferAttribute(this.positions, 3));
            geo.setAttribute('aVelocity', new THREE.BufferAttribute(this.velocities, 3));
            geo.setAttribute('aLife', new THREE.BufferAttribute(this.life, 1));
            geo.setAttribute('aSeed', new THREE.BufferAttribute(this.seed, 1));
            geo.setAttribute('aSize', new THREE.BufferAttribute(this.size, 1));
            geo.setDrawRange(0, 0);

            this.material = new THREE.ShaderMaterial({
                vertexShader: smokeVertexShader,
                fragmentShader: smokeFragmentShader,
                uniforms: {
                    uTime: { value: 0 }
                },
                transparent: true,
                blending: THREE.NormalBlending,
                depthWrite: false,
                depthTest: false
            });

            this.points = new THREE.Points(geo, this.material);
            this.points.frustumCulled = false;
            scene.add(this.points);
        }

        // 从后端浓度场收集发射单元: 浓度 > 0.05 的体素, 速度=垂直上升+温度梯度水平分量
        updateFromField(smokeData, fireData, dx, dz, depth, stride) {
            this.emissionCells = [];
            if (!smokeData || !fireData || !depth) return;
            const st = stride || 1;
            const w = (smokeData[0] || []).length;
            const h = (smokeData[0]?.[0]) ? smokeData[0][0].length : 0;
            if (!w || !h) return;

            const cells = [];
            for (let z = 0; z < depth; z++) {
                const layer = smokeData[z];
                if (!layer) continue;
                for (let x = 0; x < w; x++) {
                    const row = layer[x];
                    if (!row) continue;
                    for (let y = 0; y < h; y++) {
                        const c = row[y] || 0;
                        if (c <= 0.05) continue;
                        // 温度梯度水平分量 (驱动水平飘散)
                        const xm = Math.max(0, x - 1), xp = Math.min(w - 1, x + 1);
                        const ym = Math.max(0, y - 1), yp = Math.min(h - 1, y + 1);
                        const gx = ((fireData[z]?.[xp]?.[y] || 0) - (fireData[z]?.[xm]?.[y] || 0)) * 0.002;
                        const gz = ((fireData[z]?.[x]?.[yp] || 0) - (fireData[z]?.[x]?.[ym] || 0)) * 0.002;
                        const pos = new THREE.Vector3(x * dx * st + dx * st / 2, z * dz + dz / 2, y * dx * st + dx * st / 2);
                        cells.push({
                            pos: pos,
                            vel: new THREE.Vector3(gx, 1.0, gz),
                            density: c,
                            acc: 0,
                            x: x, y: y, z: z
                        });
                    }
                }
            }
            // ★ 空间分层采样: 按浓度降序, 每 ~2m 网格桶只取一个发射单元,
            //   让烟云均匀覆盖整个建筑, 而不是扫描序前 500 个全挤在一个角落
            cells.sort((a, b) => b.density - a.density);
            const bucket = Math.max(2, Math.floor(Math.max(w, h) / 10));
            const bucketSet = new Set();
            const chosen = [];
            for (const c of cells) {
                const k = Math.floor(c.x / bucket) + ',' + Math.floor(c.y / bucket);
                if (bucketSet.has(k)) continue;
                bucketSet.add(k);
                chosen.push(c);
                if (chosen.length >= 500) break;
            }
            if (chosen.length < 500 && chosen.length < cells.length) {
                for (const c of cells) {
                    if (chosen.includes(c)) continue;
                    chosen.push(c);
                    if (chosen.length >= 500) break;
                }
            }
            this.emissionCells = chosen;
        }

        emit(dt) {
            const scale = this.emissionScale;
            for (const cell of this.emissionCells) {
                const rate = Math.min(8, 1 + cell.density * 12) * scale;
                cell.acc += rate * dt;
                const n = Math.floor(cell.acc);
                cell.acc -= n;
                for (let i = 0; i < n; i++) {
                    if (this.activeCount >= this.maxParticles) return;
                    const idx = this.activeCount++;
                    this.positions[idx*3]   = cell.pos.x + (Math.random() - 0.5) * dx;
                    this.positions[idx*3+1] = cell.pos.y + (Math.random() - 0.5) * dz;
                    this.positions[idx*3+2] = cell.pos.z + (Math.random() - 0.5) * dx;
                    this.velocities[idx*3]   = cell.vel.x + (Math.random() - 0.5) * 0.2;
                    this.velocities[idx*3+1] = cell.vel.y * (0.8 + Math.random() * 0.4);
                    this.velocities[idx*3+2] = cell.vel.z + (Math.random() - 0.5) * 0.2;
                    this.life[idx] = 1.0;
                    this.seed[idx] = Math.random();
                    this.size[idx] = 40 + Math.random() * 25;
                }
            }
        }

        update(dt, time, camera) {
            // LOD: 相机远离时降低发射率
            let scale = 1.0;
            if (camera && this.emissionCells.length > 0) {
                const dist = this.emissionCells[0].pos.distanceTo(camera.position);
                if (dist > 25) scale = 0.3;
            }
            if (this.activeCount >= this.maxParticles * 0.9) scale *= 0.5;
            this.emissionScale = scale;

            this.emit(dt);
            const decay = dt / 3.0;  // 烟雾粒子寿命 ~3s
            for (let i = 0; i < this.activeCount; i++) {
                this.life[i] -= decay;
            }
            let writeIdx = 0;
            for (let i = 0; i < this.activeCount; i++) {
                if (this.life[i] > 0) {
                    if (writeIdx !== i) {
                        this.positions[writeIdx*3]   = this.positions[i*3];
                        this.positions[writeIdx*3+1] = this.positions[i*3+1];
                        this.positions[writeIdx*3+2] = this.positions[i*3+2];
                        this.velocities[writeIdx*3]   = this.velocities[i*3];
                        this.velocities[writeIdx*3+1] = this.velocities[i*3+1];
                        this.velocities[writeIdx*3+2] = this.velocities[i*3+2];
                        this.life[writeIdx] = this.life[i];
                        this.seed[writeIdx] = this.seed[i];
                        this.size[writeIdx] = this.size[i];
                    }
                    writeIdx++;
                }
            }
            this.activeCount = writeIdx;
            this.points.geometry.setDrawRange(0, this.activeCount);
            this.points.geometry.attributes.position.needsUpdate = true;
            this.points.geometry.attributes.aVelocity.needsUpdate = true;
            this.points.geometry.attributes.aLife.needsUpdate = true;
            this.points.geometry.attributes.aSeed.needsUpdate = true;
            this.points.geometry.attributes.aSize.needsUpdate = true;
            this.material.uniforms.uTime.value = time;
        }

        dispose() {
            this.scene.remove(this.points);
            this.points.geometry.dispose();
            this.material.dispose();
        }
    }

    // ================================================================
    // 5b. 体积烟雾渲染 (3D Texture + Ray Marching)
    // ================================================================
    const volumeVertexShader = `
        out vec3 vWorldPos;
        void main() {
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldPos = wp.xyz;
            gl_Position = projectionMatrix * viewMatrix * wp;
        }
    `;

    const volumeFragmentShader = `
        precision highp float;
        uniform highp sampler2D uSmokeTex;
        uniform highp sampler2D uTempTex;
        uniform float uLayerCount;    // 高度层数 (3D场打包进2D图集)
        uniform vec3 uBoxHalf;        // 建筑半尺寸 (米)
        uniform vec3 uBoxCenter;      // 建筑中心世界坐标
        uniform vec3 uCameraPos;
        uniform vec3 uLightDir;
        uniform vec3 uLightColor;
        uniform vec3 uAmbientColor;
        uniform float uAbsorption;
        uniform float uScattering;
        uniform float uStepSize;
        uniform int uMaxSteps;
        uniform float uDensityThreshold;
        uniform float uTime;

        in vec3 vWorldPos;
        out vec4 outFragColor;

        vec2 rayBoxIntersect(vec3 ro, vec3 rd, vec3 bmin, vec3 bmax) {
            vec3 invR = 1.0 / rd;
            vec3 t0 = (bmin - ro) * invR;
            vec3 t1 = (bmax - ro) * invR;
            vec3 tmin = min(t0, t1);
            vec3 tmax = max(t0, t1);
            float tN = max(max(tmin.x, tmin.y), tmin.z);
            float tF = min(min(tmax.x, tmax.y), tmax.z);
            return vec2(tN, tF);
        }

        float hgPhase(float cosT, float g) {
            float g2 = g * g;
            return (1.0 - g2) / (4.0 * 3.14159265 * pow(1.0 + g2 - 2.0 * g * cosT, 1.5));
        }

        // 3D采样: uvw=(X, 深度, 高度) → 2D图集坐标
        float sampleField(sampler2D tex, vec3 uvw) {
            vec2 auv = vec2(uvw.x, (uvw.z * uLayerCount + uvw.y) / uLayerCount);
            return texture(tex, auv).r;
        }

        void main() {
            vec3 ro = vWorldPos - uBoxCenter;
            // ★ 光线方向: 从远面朝相机方向步进 (BackSide 远面 → 穿过体积 → 相机)
            vec3 rd = normalize(uCameraPos - vWorldPos);

            vec2 tHit = rayBoxIntersect(ro, rd, -uBoxHalf, uBoxHalf);
            if (tHit.x > tHit.y) discard;

            float tStart = max(tHit.x, 0.0);
            float tEnd = tHit.y;

            vec3 accumColor = vec3(0.0);
            float accumAlpha = 0.0;

            for (int i = 0; i < 256; i++) {
                if (i >= uMaxSteps) break;
                float t = tStart + float(i) * uStepSize;
                if (t > tEnd) break;

                vec3 sp = ro + rd * t;
                vec3 p = sp / uBoxHalf;
                // 建筑坐标 → 3D场坐标: uvw=(X, 深度, 高度)
                vec3 uvw = vec3(p.x, p.z, p.y) * 0.5 + 0.5;

                float density = sampleField(uSmokeTex, uvw) / 255.0;
                if (density < uDensityThreshold) continue;

                float temp = 293.15 + sampleField(uTempTex, uvw) / 255.0 * 880.0;
                float excessT = max(0.0, temp - 293.15);

                // === 颜色: 深灰浓烟 (可见性好), 高温区偏灰亮 ===
                vec3 smokeColor = mix(vec3(0.08), vec3(0.25), density);
                smokeColor += vec3(0.05) * smoothstep(300.0, 800.0, excessT);

                // === 光照散射 ===
                float lightTrans = exp(-density * uAbsorption * 0.8);
                float cosT = dot(rd, uLightDir);
                float phase = hgPhase(cosT, 0.55);

                vec3 scatterL = uLightColor * lightTrans * phase * uScattering;
                vec3 ambientL = uAmbientColor * uScattering * 0.25;
                vec3 emissive = vec3(1.0, 0.4, 0.1) * smoothstep(400.0, 900.0, excessT) * density * 0.3;

                vec3 totalLight = scatterL + ambientL + emissive;
                vec3 color = smokeColor * totalLight;

                // === Beer-Lambert 累积 ===
                float absorp = density * uAbsorption * uStepSize;
                float alpha = 1.0 - exp(-absorp);

                accumColor += (1.0 - accumAlpha) * color * alpha;
                accumAlpha += (1.0 - accumAlpha) * alpha;

                if (accumAlpha > 0.97) break;
            }

            if (accumAlpha < 0.01) discard;
            outFragColor = vec4(accumColor, accumAlpha);
        }
    `;

    class VolumeSmoke {
        constructor(scene) {
            this.scene = scene;
            this.mesh = null;
            this.smokeTex = null;
            this.tempTex = null;
            this.material = null;
            this.dims = { w: 0, h: 0, d: 0 };
        }

        update(data, dx, dz) {
            if (!data || !data.smoke || !data.temp) return;
            const stride = data.stride || 1;
            const dw = Math.ceil(data.width / stride);
            const dh = Math.ceil(data.height / stride);
            const dd = Math.ceil(data.depth / stride);
            const need = dw * dh * dd;
            if (data.smoke.length < need || data.temp.length < need) return;
            // ★ 2D 图集: 每高度层一行 (dw x dh*dd), 后端扁平化顺序可直接复用
            const atlasW = dw, atlasH = dh * dd;
            const smokeArr = new Uint8Array(atlasW * atlasH * 4);
            const tempArr = new Uint8Array(atlasW * atlasH * 4);
            let maxS = -1, maxIdx = 0;
            for (let i = 0; i < need; i++) {
                const s = Math.max(0, Math.min(1, data.smoke[i] || 0));
                smokeArr[i * 4] = Math.round(s * 255);
                if (s > maxS) { maxS = s; maxIdx = i; }
                const t = Math.max(293.15, data.temp[i] || 0);
                tempArr[i * 4] = Math.round(Math.min(1, (t - 293.15) / 880.0) * 255);
            }

            if (!this.mesh || this.dims.w !== dw || this.dims.h !== dh || this.dims.d !== dd) {
                this.dispose();
                this.dims = { w: dw, h: dh, d: dd };

                this.smokeTex = new THREE.DataTexture(smokeArr, atlasW, atlasH, THREE.RGBAFormat);
                this.smokeTex.type = THREE.UnsignedByteType;
                this.smokeTex.minFilter = THREE.LinearFilter;
                this.smokeTex.magFilter = THREE.LinearFilter;
                this.smokeTex.wrapS = THREE.ClampToEdgeWrapping;
                this.smokeTex.wrapT = THREE.ClampToEdgeWrapping;
                this.smokeTex.needsUpdate = true;

                this.tempTex = new THREE.DataTexture(tempArr, atlasW, atlasH, THREE.RGBAFormat);
                this.tempTex.type = THREE.UnsignedByteType;
                this.tempTex.minFilter = THREE.LinearFilter;
                this.tempTex.magFilter = THREE.LinearFilter;
                this.tempTex.wrapS = THREE.ClampToEdgeWrapping;
                this.tempTex.wrapT = THREE.ClampToEdgeWrapping;
                this.tempTex.needsUpdate = true;

                const boxW = data.width * dx, boxH = data.depth * dz, boxD = data.height * dx;
                const geo = new THREE.BoxGeometry(boxW, boxH, boxD);
                geo.translate(boxW / 2, boxH / 2, boxD / 2);

                this.material = new THREE.ShaderMaterial({
                    vertexShader: volumeVertexShader,
                    fragmentShader: volumeFragmentShader,
                    glslVersion: THREE.GLSL3,
                    uniforms: {
                        uSmokeTex: { value: this.smokeTex },
                        uTempTex: { value: this.tempTex },
                        uLayerCount: { value: dd },
                        uBoxHalf: { value: new THREE.Vector3(boxW / 2, boxH / 2, boxD / 2) },
                        uBoxCenter: { value: new THREE.Vector3(boxW / 2, boxH / 2, boxD / 2) },
                        uCameraPos: { value: new THREE.Vector3() },
                        uLightDir: { value: new THREE.Vector3(0.3, 0.9, 0.2).normalize() },
                        uLightColor: { value: new THREE.Color(0.95, 0.90, 0.80) },
                        uAmbientColor: { value: new THREE.Color(0.15, 0.15, 0.18) },
                        uAbsorption: { value: 14.0 },
                        uScattering: { value: 3.0 },
                        uStepSize: { value: 0.2 },
                        uMaxSteps: { value: 256 },
                        uDensityThreshold: { value: 0.008 },
                        uTime: { value: 0 }
                    },
                    transparent: true,
                    side: THREE.BackSide,
                    depthWrite: false,
                    depthTest: true,
                    blending: THREE.NormalBlending
                });

                this.mesh = new THREE.Mesh(geo, this.material);
                this.mesh.frustumCulled = false;
                this.mesh.renderOrder = 2;
                this.scene.add(this.mesh);
            } else {
                this.smokeTex.image.data.set(smokeArr);
                this.smokeTex.needsUpdate = true;
                this.tempTex.image.data.set(tempArr);
                this.tempTex.needsUpdate = true;
            }
        }

        updateFrame(camera, time) {
            if (!this.material) return;
            this.material.uniforms.uCameraPos.value.copy(camera.position);
            this.material.uniforms.uTime.value = time;
        }

        setVisible(v) {
            if (this.mesh) this.mesh.visible = v;
        }

        dispose() {
            if (this.mesh) {
                this.scene.remove(this.mesh);
                this.mesh.geometry.dispose();
                this.material.dispose();
                if (this.smokeTex) this.smokeTex.dispose();
                if (this.tempTex) this.tempTex.dispose();
                this.mesh = null;
            }
        }
    }

    // ================================================================
    // 6. 3D 场景初始化
    // ================================================================
    function init3D() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);

        camera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
        camera.position.set(60, 40, 60);

        renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(canvas.clientWidth, canvas.clientHeight);
        renderer.shadowMap.enabled = true;

        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(10, 10, 12 * dz / 2);
        controls.update();

        const ambLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 50, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const gridHelper = new THREE.GridHelper(30, 20, 0x444466, 0x222244);
        gridHelper.position.set(10, 10, -0.1);
        scene.add(gridHelper);

        loadingTip.style.display = 'none';
        addLog('3D 引擎加载完毕，按住左键可旋转视角', 'info');
        fireParticles = new FireParticleSystem(scene, 3000);
        // ★ 体积烟雾接管: 粒子烟雾停用
        // smokeParticles = new SmokeParticleSystem(scene, 6000);
        volumeSmoke = new VolumeSmoke(scene);
        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        const dt = clock.getDelta();
        const time = clock.getElapsedTime();
        if (fireParticles) fireParticles.update(dt, time, camera);
        // if (smokeParticles) smokeParticles.update(dt, time, camera);
        if (volumeSmoke) volumeSmoke.updateFrame(camera, time);
        controls.update();
        renderer.render(scene, camera);
    }

    function resizeCanvas() {
        let c = document.querySelector('.canvas-container');
        let maxW = c.clientWidth - 20;
        let maxH = c.clientHeight - 20;
        let ratio = 1000 / 700;
        let w = Math.min(maxW, maxH * ratio);
        let h = w / ratio;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        if (renderer) {
            renderer.setSize(w, h);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
    }
    window.addEventListener('resize', resizeCanvas);

    // ================================================================
    // 7. 核心渲染函数 (真正 3D 全数据支持)
    // ================================================================
    function update3DWorld(data) {
        if (!data) return;
        const depth = data.depth || 8;
        const st = data.stride || 1;
        const w = (data.obstacle && data.obstacle[0]) ? data.obstacle[0].length : Math.ceil(data.width / st);
        const h = (data.obstacle && data.obstacle[0] && data.obstacle[0][0]) ? data.obstacle[0][0].length : Math.ceil(data.height / st);

        scene.remove(personGroup);
        personGroup = new THREE.Group();

        const matrices = [];
        const colors = [];
        const dummy = new THREE.Object3D();

        // ★ 遍历真正的 3D 网格数据 (障碍物、温度、烟雾)
        for (let z = 0; z < depth; z++) {
            const zPos = z * dz + dz / 2;  // z(垂直) 未降采样
            for (let x = 0; x < w; x++) {
                const xPos = x * dx * st + dx * st / 2;
                for (let y = 0; y < h; y++) {
                    const yPos = y * dx * st + dx * st / 2;

                    // ★ 取出 3D 空间对应位置的属性
                    const obs = data.obstacle[z]?.[x]?.[y];
                    const temp = data.fire[z]?.[x]?.[y] || T_AMB;
                    const smoke = data.smoke[z]?.[x]?.[y] || 0;

                    let color = null;
                    let draw = false;

                    // 1. 优先渲染建筑结构（墙、楼板、楼梯、出口等）
                    if (obs !== undefined && obs !== 0) {
                        draw = true;
                        color = valueToColor(obs);
                    }
                    // 2. 烟雾已由 GPU 粒子系统渲染, 此处跳过立方体
                    else if (smoke > 0.001) {
                        draw = false;
                    }
                    // 3. 温度分级渲染（仅无烟雾时显示）
                    else if (temp > 473.15) {
                        // 火焰已由 GPU 粒子系统渲染, 此处跳过立方体
                        draw = false;
                    } else if (temp > 373.15) {
                        // 火焰已由 GPU 粒子系统渲染, 此处跳过立方体
                        draw = false;
                    }

                    if (draw && color) {
                        dummy.position.set(xPos, yPos, zPos);
                        dummy.updateMatrix();
                        matrices.push(dummy.matrix.clone());
                        colors.push(color);
                    }
                }
            }
        }

        // 生成 Mesh
        if (matrices.length > 0) {
            if (!voxelMesh || matrices.length !== voxelMesh.count) {
                if (voxelMesh) scene.remove(voxelMesh);
                const geometry = new THREE.BoxGeometry(dx * st * 0.9, dz * 0.9, dx * st * 0.9);
                const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
                voxelMesh = new THREE.InstancedMesh(geometry, material, matrices.length);
                voxelMesh.castShadow = true;
                scene.add(voxelMesh);
            }
            for (let i = 0; i < matrices.length; i++) {
                voxelMesh.setMatrixAt(i, matrices[i]);
                voxelMesh.setColorAt(i, colors[i]);
            }
            voxelMesh.instanceMatrix.needsUpdate = true;
            voxelMesh.instanceColor.needsUpdate = true;
        } else if (voxelMesh) {
            scene.remove(voxelMesh);
            voxelMesh = null;
        }

        // ★ 人员生成：接收最新的 3D 坐标 (x, y, z)
        if (data.persons && data.persons.length > 0) {
            const sphereGeo = new THREE.SphereGeometry(dx * 0.35, 8, 8);
            const sphereMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
            for (let p of data.persons) {
                const sphere = new THREE.Mesh(sphereGeo, sphereMat);
                // 提取第三个参数 p[2] 作为人员所在高度
                sphere.position.set(p[0] * dx + dx/2, p[1] * dx + dx/2, p[2] * dz + dz/2);
                personGroup.add(sphere);
            }
            scene.add(personGroup);
        }
    }

    // ================================================================
    // 8. 绑定 UI 控制按钮 (保持原本逻辑)
    // ================================================================
    document.getElementById('startBtn').onclick = () => sendCommand('start');
    document.getElementById('pauseBtn').onclick = () => sendCommand('pause');
    document.getElementById('resumeBtn').onclick = () => sendCommand('resume');
    document.getElementById('stepBtn').onclick = () => sendCommand('step');
    document.getElementById('resetBtn').onclick = () => {
        if (voxelMesh) { scene.remove(voxelMesh); voxelMesh = null; }
        sendCommand('reset');
    };

    document.getElementById('togglePersonsBtn').onclick = function() {
        sendCommand('togglePersons');
        this.textContent = this.textContent.includes('隐藏') ? '👤 显示人员' : '👤 隐藏人员';
    };

    document.querySelectorAll('.speed-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            let speed = parseInt(this.dataset.speed);
            sendCommand('speed_' + speed);
            addLog(`速度切换至 ${speed} 倍`, 'info');
        });
    });

    // ================================================================
    // 9. 模态框兼容 (地图编辑器保持原样)
    // ================================================================
    const modal = document.getElementById('mapModal');
    const modalClose = document.querySelector('.close');

    document.getElementById('mapBtn').onclick = () => {
        modal.style.display = 'block';
        controls.enabled = false;
        loadMapList();
        initEditor();
    };
    modalClose.onclick = () => {
        modal.style.display = 'none';
        controls.enabled = true;
    };
    window.onclick = e => {
        if (e.target === modal) {
            modal.style.display = 'none';
            controls.enabled = true;
        }
    };

    let editorCanvas = document.getElementById('editorCanvas');
    let editorCtx = editorCanvas.getContext('2d');
    let editorWidth = 120, editorHeight = 80;
    let editorObstacles = null;
    let currentDrawType = 0;
    let boundaryPoints = [];
    let isDrawingBoundary = false;
    let isDrawingFire = false;
    let fireSources = [];

    function initEditor() {
        editorCanvas.width = 600; editorCanvas.height = 400;
        fetch('/state').then(r => r.json()).then(d => {
            // obstacle 维度约定: [Z][X][Y] , 取 Z=0 层作为编辑对象
            let z0 = (Array.isArray(d.obstacle) && d.obstacle.length > 0 && Array.isArray(d.obstacle[0])) ? d.obstacle[0] : (Array.isArray(d.obstacle) ? d.obstacle : null);
            if (!z0 || !Array.isArray(z0) || z0.length === 0 || !Array.isArray(z0[0])) {
                throw new Error("obstacle 数据格式异常或为空");
            }
            // 根据真实尺寸同步编辑器大小
            editorWidth = z0.length;
            editorHeight = z0[0].length;
            editorObstacles = z0;
            fireSources = d.fireSources || [];
            drawEditor();
        }).catch(e => addLog("初始化编辑器失败: " + e, 'error'));
    }

    function drawEditor() {
        if (!editorObstacles || !editorWidth || !editorHeight) return;
        let cellW = editorCanvas.width / editorWidth;
        let cellH = editorCanvas.height / editorHeight;
        editorCtx.clearRect(0, 0, editorCanvas.width, editorCanvas.height);

        for (let i = 0; i < editorWidth; i++) {
            for (let j = 0; j < editorHeight; j++) {
                let row = editorObstacles[i];
                let val = (row && row.length > j) ? row[j] : 0;
                if (val === 1) editorCtx.fillStyle = '#4a4a5a';
                else if (val === 2) editorCtx.fillStyle = '#ff8c00';
                else if (val === 3) editorCtx.fillStyle = '#2196f3';
                else if (val === 4) editorCtx.fillStyle = '#4caf50';
                else if (val === 5) editorCtx.fillStyle = '#ff1744';
                else editorCtx.fillStyle = '#111';
                editorCtx.fillRect(i * cellW, j * cellH, cellW, cellH);
                editorCtx.strokeStyle = '#333';
                editorCtx.strokeRect(i * cellW, j * cellH, cellW, cellH);
            }
        }
        for (let f of fireSources) {
            let x = f.x * cellW + cellW / 2, y = f.y * cellH + cellH / 2;
            editorCtx.fillStyle = '#ff1744';
            editorCtx.beginPath(); editorCtx.arc(x, y, Math.min(cellW, cellH) / 2.5, 0, 2 * Math.PI); editorCtx.fill();
            editorCtx.strokeStyle = '#fff'; editorCtx.lineWidth = 1; editorCtx.stroke();
        }
    }

    function loadMapList() {
        fetch('/listMaps').then(r => r.json()).then(data => {
            let ul = document.getElementById('mapList'); ul.innerHTML = '';
            if (!data.maps || data.maps.length === 0) {
                ul.innerHTML = '<li style="justify-content:center;">暂无地图文件</li>';
                return;
            }
            data.maps.forEach(map => {
                let li = document.createElement('li');
                let span = document.createElement('span');
                span.textContent = map;
                span.onclick = () => {
                    if (confirm(`加载地图 ${map} 会重置当前模拟，确定吗？`)) {
                        fetch(`/loadMap?name=${encodeURIComponent(map)}`, { method: 'POST' }).then(() => {
                            addLog(`已加载地图: ${map}`, 'info');
                            modal.style.display = 'none'; controls.enabled = true;
                            fetchState();
                        }).catch(e => addLog(`加载失败: ${e}`, 'error'));
                    }
                };
                li.appendChild(span); ul.appendChild(li);
            });
        }).catch(e => addLog('获取地图列表失败: ' + e, 'error'));
    }

    document.getElementById('drawEmptyBtn').onclick = () => { currentDrawType = 0; };
    document.getElementById('drawWallBtn').onclick = () => { currentDrawType = 1; };
    document.getElementById('drawCombustBtn').onclick = () => { currentDrawType = 2; };
    document.getElementById('drawDoorBtn').onclick = () => { currentDrawType = 3; };
    document.getElementById('drawExitBtn').onclick = () => { currentDrawType = 4; };
    document.getElementById('clearMapBtn').onclick = () => {
        if (confirm('清除所有障碍物？')) {
            for (let i = 0; i < editorWidth; i++) for (let j = 0; j < editorHeight; j++) editorObstacles[i][j] = 0;
            drawEditor();
        }
    };
    document.getElementById('saveNewMapBtn').onclick = () => {
        let name = document.getElementById('newMapName').value.trim() || 'custom.map';
        if (!name.endsWith('.map')) name += '.map';
        fetch('/saveMap', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: `name=${encodeURIComponent(name)}` })
            .then(() => { addLog(`地图已保存: ${name}`, 'info'); loadMapList(); })
            .catch(e => addLog(`保存失败: ${e}`, 'error'));
    };

    function handleEditorClick(e, isRight) {
        let rect = editorCanvas.getBoundingClientRect();
        let scaleX = editorCanvas.width / rect.width, scaleY = editorCanvas.height / rect.height;
        let mouseX = (e.clientX - rect.left) * scaleX, mouseY = (e.clientY - rect.top) * scaleY;
        let cellW = editorCanvas.width / editorWidth, cellH = editorCanvas.height / editorHeight;
        let gridX = Math.floor(mouseX / cellW), gridY = Math.floor(mouseY / cellH);
        if (gridX < 0 || gridX >= editorWidth || gridY < 0 || gridY >= editorHeight) return;

        if (isDrawingFire) {
            let idx = fireSources.findIndex(f => f.x === gridX && f.y === gridY);
            if (idx >= 0) fireSources.splice(idx, 1);
            else fireSources.push({ x: gridX, y: gridY });
            drawEditor();
            syncFireSources();
            return;
        }
        if (isRight) editorObstacles[gridX][gridY] = 0;
        else editorObstacles[gridX][gridY] = currentDrawType;
        drawEditor();
    }
    function syncFireSources() {
        if (fireSources.length === 0) return;
        let coords = fireSources.map(f => [f.x, f.y]);
        fetch('/setFireSources', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sources: coords }) })
            .then(() => addLog('火源已更新', 'info')).catch(err => addLog('更新火源失败: ' + err, 'error'));
    }

    editorCanvas.addEventListener('click', function(e) { handleEditorClick(e, false); });
    editorCanvas.addEventListener('contextmenu', function(e) { e.preventDefault(); handleEditorClick(e, true); return false; });
    document.getElementById('refreshMapsBtn').onclick = loadMapList;
    document.getElementById('drawBoundaryBtn').onclick = function() {
        isDrawingBoundary = !isDrawingBoundary;
        boundaryPoints = [];
        addLog(isDrawingBoundary ? '进入边界绘制模式：点击画点，双击闭合' : '退出边界绘制模式', 'info');
        this.textContent = isDrawingBoundary ? '🟨 取消边界' : '🟨 边界';
        drawEditor();
    };
    document.getElementById('drawFireBtn').onclick = function() {
        isDrawingFire = !isDrawingFire;
        addLog(isDrawingFire ? '进入火源绘制模式' : '退出火源绘制模式', 'info');
        this.textContent = isDrawingFire ? '🔥 取消火源' : '🔥 火源';
        drawEditor();
    };
    editorCanvas.addEventListener('dblclick', function(e) {
        if (!isDrawingBoundary || boundaryPoints.length < 3) return;
        fetch('/setBoundary', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ points: boundaryPoints }) })
            .then(() => { addLog('边界已设置', 'info'); isDrawingBoundary = false; document.getElementById('drawBoundaryBtn').textContent = '🟨 边界'; initEditor(); modal.style.display = 'none'; controls.enabled = true; fetchState(); })
            .catch(err => addLog('设置边界失败: ' + err, 'error'));
    });

    document.getElementById('generateMapBtn').onclick = function() {
        const file = document.getElementById('imageInput').files[0];
        if (!file) { addLog('请先选择一张图片', 'error'); return; }
        const reader = new FileReader();
        reader.onload = function(ev) {
            const base64 = ev.target.result.split(',')[1];
            const threshold = parseInt(document.getElementById('thresholdSlider').value);
            fetch('/uploadMapImage', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ imageData: base64, threshold: threshold }) })
                .then(response => {
                    if (response.ok) { addLog('地图已从图片生成并应用', 'info'); modal.style.display = 'none'; controls.enabled = true; fetchState(); initEditor(); }
                    else { addLog('生成地图失败: ' + response.status, 'error'); }
                }).catch(err => addLog('请求失败: ' + err, 'error'));
        };
        reader.readAsDataURL(file);
    };

    // ================================================================
    // 10. 启动运行！
    // ================================================================
    setTimeout(resizeCanvas, 100);
    init3D();
    setInterval(fetchState, 1000);

    // ★ 体积烟雾: 独立低频轮询 /smokeVolume (服务器按时间缓存, 开销小)
    async function fetchSmokeVolume() {
        try {
            const resp = await fetch('/smokeVolume');
            if (!resp.ok) return;
            const data = await resp.json();
            if (volumeSmoke) volumeSmoke.update(data, dx, dz);
        } catch (e) {
            // 静默失败, 不影响主循环
        }
    }
    setInterval(fetchSmokeVolume, 500);
    fetchState();
    addLog('3D 物理真实版加载完成，按住左键可旋转视角', 'info');
</script>
</body>
</html>
